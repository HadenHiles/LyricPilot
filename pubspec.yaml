name: lyric_pilot
description: "LyricPilot — a smart lyric and chord teleprompter for musicians."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.1

# App icon generation config — run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1C1B1F"
  adaptive_icon_foreground: "assets/icon.png"
  remove_alpha_ios: true

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management — Riverpod with code-gen annotations (generator added in Phase 1)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.3

  # Typography — readable musician-friendly font
  google_fonts: ^6.2.1

  # Immutable models with Freezed codegen (Phase 1)
  freezed_annotation: ^2.4.4

  # JSON serialization — used for persistence layer (Phase 2)
  json_annotation: ^4.9.0

  # Phase 2 additions (local persistence — JSON files on device)
  # Using JSON file storage instead of Isar: simpler, no code-gen schema,
  # adequate for song library size, easily testable.
  path_provider: ^2.1.5

  # Phase 3 — Keep screen awake during active performance session.
  wakelock_plus: ^1.3.4

  # Phase 3+ — Persist performance display preferences (font size, line
  # spacing, tempo) across sessions using platform key-value storage.
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation (Phase 1)
  build_runner: ^2.4.14
  freezed: ^2.5.7
  riverpod_generator: ^2.6.2

  # App icon generation — run: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.0

  # Phase 2 (JSON serialization code generation)
  json_serializable: ^6.9.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/
